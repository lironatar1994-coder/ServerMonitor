log_format monitor_host_combined
    '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" "$host"';

# Explicit per-browser internal opt-out on every host: the monitor_internal cookie, or
# the marking request itself. Ordinary Nginx diagnostic logs remain intact.
map "$cookie_monitor_internal:$arg_monitor_internal" $monitor_public_request {
    default 1;
    ~^1: 0;
    ~:1$ 0;
}
access_log /var/log/nginx/monitor_host_access.log monitor_host_combined if=$monitor_public_request;
